<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPELTA Caracas | Panadería Artesanal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f3ed] min-h-screen font-sans text-[#2c221e] pb-24">

  <!-- Encabezado con espacio para Logo -->
  <header class="bg-[#efe4c8] border-b border-[#d6c5ad] py-6 px-4 text-center shadow-xs relative">
  <!-- Botón de Admin -->
  <button onclick="openAdminModal()" class="absolute top-4 right-4 text-xs font-bold text-[#6b584a] hover:text-[#2c221e] bg-white/60 hover:bg-white px-2.5 py-1.5 rounded-lg border border-[#d6c5ad] transition-all">
    ⚙️ Admin
  </button>

  <!-- Logo Agrandado -->
  <img id="store-logo" src="logo.png" alt="SPELTA Logo" class="h-44 sm:h-52 mx-auto object-contain" onerror="this.style.display='none'">
</header>

  <!-- Banner de Horario -->
  <div id="schedule-banner" class="hidden bg-amber-100 border-b border-amber-300 text-amber-900 text-xs text-center py-2.5 px-4 font-bold"></div>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Panel de Tasa BCV -->
    <section class="bg-white p-3.5 rounded-xl border border-[#d6c5ad] shadow-xs flex items-center justify-between">
      <div>
        <span class="block text-xs font-bold uppercase tracking-wider text-[#6b584a]">Tasa Oficial BCV del día</span>
        <span id="bcv-status" class="text-[10px] text-gray-500">Cargando tasa oficial...</span>
      </div>
      <div class="text-right">
        <span id="bcv-rate-display" class="text-lg font-bold text-[#2c221e]">--.--</span>
        <span class="text-xs font-bold text-[#6b584a]">Bs/$</span>
      </div>
    </section>

    <!-- Menú: Galletas -->
    <section>
      <h2 class="text-xl font-serif font-bold text-[#2c221e] border-b border-[#d6c5ad] pb-1 mb-3 flex items-center gap-2">
        <span>🍪</span> GALLETAS
      </h2>
      <div id="catalog-galletas" class="space-y-2.5"></div>
    </section>

    <!-- Menú: Panes -->
    <section>
      <h2 class="text-xl font-serif font-bold text-[#2c221e] border-b border-[#d6c5ad] pb-1 mb-3 flex items-center gap-2">
        <span>🥖</span> PANES
      </h2>
      <div id="catalog-panes" class="space-y-2.5"></div>
    </section>

    <!-- Resumen del Pedido -->
    <section class="bg-white p-4 rounded-xl border border-[#d6c5ad] shadow-xs">
      <h2 class="text-base font-serif font-bold text-[#2c221e] mb-2">Resumen de Tu Pedido</h2>
      <div id="order-summary" class="text-xs text-gray-600 space-y-1 mb-3">
        <p class="italic">No has seleccionado ningún producto.</p>
      </div>
      <div class="border-t border-gray-200 pt-2 flex justify-between items-center font-bold text-base text-[#2c221e]">
        <span>Total:</span>
        <span id="total-price">$0.00</span>
      </div>
      <div class="text-right text-xs text-[#6b584a] font-medium mt-0.5">
        Equivalente: <span id="total-bs" class="font-bold">0.00 Bs.</span>
      </div>
    </section>

    <!-- Datos del Cliente -->
    <section class="bg-white p-4 rounded-xl border border-[#d6c5ad] shadow-xs space-y-3">
      <h2 class="text-base font-serif font-bold text-[#2c221e]">Datos de Entrega y Pago</h2>
      
      <div>
        <label class="block text-xs font-medium text-[#6b584a] mb-1">Nombre Completo *</label>
        <input type="text" id="cust-name" placeholder="Ej: María Pérez" class="w-full border border-gray-300 rounded-lg p-2 text-xs outline-none focus:border-[#6b584a]">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-[#6b584a] mb-1">Modalidad de Entrega</label>
          <select id="delivery-method" class="w-full border border-gray-300 rounded-lg p-2 text-xs outline-none">
            <option value="Punto de Encuentro Acordado">Acordar Punto de Encuentro</option>
            <option value="Retiro Acordado">Retiro Previa Cita</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-[#6b584a] mb-1">Método de Pago</label>
          <select id="payment-method" class="w-full border border-gray-300 rounded-lg p-2 text-xs outline-none">
            <option value="Pago Móvil">Pago Móvil</option>
            <option value="Zelle">Zelle</option>
            <option value="Efectivo USD">Efectivo USD</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-[#6b584a] mb-1">Notas / Detalles del Punto de Encuentro</label>
        <textarea id="cust-notes" rows="2" placeholder="Ej: Nos vemos en la plaza/estación a las 3 PM." class="w-full border border-gray-300 rounded-lg p-2 text-xs outline-none"></textarea>
      </div>
    </section>

    <!-- Botón WhatsApp -->
    <button id="submit-btn" onclick="processOrder()" class="w-full bg-[#25d366] hover:bg-[#20bd5a] text-white font-bold py-3.5 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition-all">
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
      Enviar Pedido por WhatsApp
    </button>

  </main>

  <!-- Modal de Administración -->
  <div id="admin-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-[#2c221e]">Panel de Control SPELTA</h3>
        <button onclick="closeAdminModal()" class="text-gray-500 font-bold text-xl">&times;</button>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold text-[#6b584a]">Forzar Tasa BCV Manual (Bs/$)</label>
        <div class="flex gap-2">
          <input type="number" step="0.01" id="manual-rate-input" placeholder="Ej: 36.50" class="flex-1 border p-2 rounded-lg text-xs">
          <button onclick="saveManualRate()" class="bg-[#2c221e] text-white text-xs px-3 py-2 rounded-lg">Guardar</button>
        </div>
      </div>

      <div class="space-y-2">
        <h4 class="font-bold text-xs text-[#6b584a] uppercase">Disponibilidad de Productos</h4>
        <div id="admin-products-list" class="space-y-2 divide-y divide-gray-100"></div>
      </div>

      <button onclick="resetAdminSettings()" class="w-full text-xs text-red-600 underline text-center block pt-2">Restablecer valores predeterminados</button>
    </div>
  </div>

  <script>
  // ==========================================
  // CONFIGURACIÓN PRINCIPAL
  // ==========================================
  const WHATSAPP_PHONE = "584248869310"; 
  
  // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
  const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbzzf2A4tytnV6hUi-BwAa1ceqwRDCXo8GK9EJJ9bT_ebzCWB_9lndvvul_CByHrRH2Lhw/exec"; 

  const SCHEDULE_CONFIG = {
    allowedDays: [1, 2, 3, 4, 5], 
    openHour: 8,                  
    closeHour: 16,                
    customClosedMessage: "Recibimos pedidos de Lunes a Viernes de 8:00 AM a 4:00 PM."
  };

  let PRODUCTS = [
    { id: 1, category: "galletas", name: "Mini Galletas", price: 3.00, available: true, maxQty: 5 },
    { id: 2, category: "galletas", name: "Cookie Balls", price: 3.50, available: true, maxQty: 5 },
    { id: 3, category: "galletas", name: "Cookie Bar", price: 4.00, available: true, maxQty: 5 },
    { id: 4, category: "panes", name: "Pan Trenzado Bicolor", price: 5.00, available: true, maxQty: 3 },
    { id: 5, category: "panes", name: "Pan de Chocolate", price: 5.50, available: true, maxQty: 3 },
    { id: 6, category: "panes", name: "Rollos de Canela", price: 3.00, available: true, maxQty: 6 },
    { id: 7, category: "panes", name: "Rollos de Chocolate", price: 3.50, available: true, maxQty: 6 },
    { id: 8, category: "panes", name: "Pan Brioche", price: 4.50, available: true, maxQty: 2 },
    { id: 9, category: "panes", name: "Bagels", price: 2.50, available: true, maxQty: 10 },
    { id: 10, category: "panes", name: "Pan de Orégano", price: 4.00, available: true, maxQty: 3 }
  ];

  const cart = {};
  let currentRate = 36.50;

  // Cargar configuraciones del Administrador almacenadas localmente
  function loadAdminSettings() {
    const savedProducts = localStorage.getItem("spelta_products");
    if (savedProducts) {
      PRODUCTS = JSON.parse(savedProducts);
    }
    const savedRate = localStorage.getItem("spelta_manual_rate");
    if (savedRate) {
      currentRate = parseFloat(savedRate);
    }
  }

  // ==========================================
  // GENERADOR DE ID ÚNICO DE PEDIDO (SP-YYMMDD-XXX)
  // ==========================================
  function generateOrderId() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const dateCode = `${yy}${mm}${dd}`;

    let lastDate = localStorage.getItem("spelta_last_order_date");
    let orderCounter = parseInt(localStorage.getItem("spelta_order_counter") || "0", 10);

    if (lastDate === dateCode) {
      orderCounter += 1;
    } else {
      lastDate = dateCode;
      orderCounter = 1;
    }

    localStorage.setItem("spelta_last_order_date", dateCode);
    localStorage.setItem("spelta_order_counter", orderCounter);

    const sequence = String(orderCounter).padStart(3, '0');
    return `SP-${dateCode}-${sequence}`;
  }

  // ==========================================
  // VERIFICACIÓN DE HORARIO
  // ==========================================
  function checkStoreStatus() {
    const now = new Date();
    const day = now.getDay();
    const hour = now.getHours();

    const isOpen = SCHEDULE_CONFIG.allowedDays.includes(day) && (hour >= SCHEDULE_CONFIG.openHour && hour < SCHEDULE_CONFIG.closeHour);
    
    const btn = document.getElementById("submit-btn");
    const banner = document.getElementById("schedule-banner");

    if (!isOpen && btn) {
      btn.disabled = true;
      btn.classList.remove("bg-[#25d366]", "hover:bg-[#20bd5a]");
      btn.classList.add("bg-gray-400", "cursor-not-allowed");
      btn.innerHTML = `🚫 Pedidos Cerrados`;

      if (banner) {
        banner.classList.remove("hidden");
        banner.innerText = `🔴 Fuera de Horario: ${SCHEDULE_CONFIG.customClosedMessage}`;
      }
    }
    return isOpen;
  }

  // ==========================================
  // CONSULTA DE TASA BCV
  // ==========================================
  async function fetchBCVRate() {
    const statusEl = document.getElementById("bcv-status");
    const displayEl = document.getElementById("bcv-rate-display");
    
    const manualRate = localStorage.getItem("spelta_manual_rate");
    if (manualRate) {
      currentRate = parseFloat(manualRate);
      statusEl.innerText = "Tasa Manual (Admin)";
      displayEl.innerText = currentRate.toFixed(2);
    } else {
      try {
        const response = await fetch("https://ve.dolarapi.com/v1/dolares/oficial");
        const data = await response.json();
        if (data && data.promedio) {
          currentRate = parseFloat(data.promedio);
          statusEl.innerText = "Actualizada hoy (BCV)";
          displayEl.innerText = currentRate.toFixed(2);
        }
      } catch (err) {
        statusEl.innerText = "Tasa de referencia";
        displayEl.innerText = currentRate.toFixed(2);
      }
    }
    
    renderCatalog();
    updateSummary();
  }

  // ==========================================
  // CATÁLOGO Y CARRITO
  // ==========================================
  function renderCatalog() {
    const galletasContainer = document.getElementById("catalog-galletas");
    const panesContainer = document.getElementById("catalog-panes");

    const createCard = (p) => {
      const priceBs = (p.price * currentRate).toFixed(2);
      
      if (!p.available) {
        return `
          <div class="bg-gray-100 p-3 rounded-xl border border-gray-200 flex justify-between items-center opacity-60">
            <div>
              <h3 class="font-bold text-sm text-gray-500 line-through">${p.name}</h3>
              <p class="text-xs font-semibold text-gray-400">$${p.price.toFixed(2)}</p>
            </div>
            <span class="text-xs font-bold bg-gray-200 text-gray-600 px-2.5 py-1 rounded-md">Agotado</span>
          </div>
        `;
      }

      return `
        <div class="bg-white p-3 rounded-xl border border-[#d6c5ad] flex justify-between items-center shadow-2xs">
          <div>
            <h3 class="font-bold text-sm text-[#2c221e]">${p.name}</h3>
            <p class="text-xs font-semibold text-[#6b584a] mt-0.5">
              $${p.price.toFixed(2)} <span class="text-[10px] text-gray-500 font-normal">(${priceBs} Bs.)</span>
            </p>
          </div>
          <div class="flex items-center gap-2 bg-[#f7f3ed] p-1 rounded-lg border border-[#d6c5ad]">
            <button onclick="updateQty(${p.id}, -1)" class="w-6 h-6 bg-white text-[#2c221e] rounded font-bold hover:bg-gray-100">-</button>
            <span id="qty-${p.id}" class="w-4 text-center text-xs font-bold">${cart[p.id] || 0}</span>
            <button onclick="updateQty(${p.id}, 1)" class="w-6 h-6 bg-[#2c221e] text-white rounded font-bold hover:bg-[#42332d]">+</button>
          </div>
        </div>
      `;
    };

    galletasContainer.innerHTML = PRODUCTS.filter(p => p.category === 'galletas').map(createCard).join('');
    panesContainer.innerHTML = PRODUCTS.filter(p => p.category === 'panes').map(createCard).join('');
  }

  function updateQty(id, change) {
    const prod = PRODUCTS.find(p => p.id === id);
    const next = (cart[id] || 0) + change;

    if (next > prod.maxQty) {
      alert(`El límite máximo por pedido para ${prod.name} es de ${prod.maxQty} unidades.`);
      return;
    }

    if (next <= 0) {
      delete cart[id];
    } else {
      cart[id] = next;
    }

    const qtyEl = document.getElementById(`qty-${id}`);
    if (qtyEl) qtyEl.innerText = cart[id] || 0;
    updateSummary();
  }

  function updateSummary() {
    const summaryDiv = document.getElementById("order-summary");
    let total = 0;
    let itemsHtml = [];

    Object.keys(cart).forEach(id => {
      const prod = PRODUCTS.find(p => p.id == id);
      const qty = cart[id];
      const subtotal = prod.price * qty;
      total += subtotal;
      itemsHtml.push(`<div class="flex justify-between"><span>${qty}x ${prod.name}</span><span>$${subtotal.toFixed(2)}</span></div>`);
    });

    summaryDiv.innerHTML = itemsHtml.length === 0 
      ? `<p class="italic text-gray-400">No has seleccionado ningún producto.</p>` 
      : itemsHtml.join('');

    document.getElementById("total-price").innerText = `$${total.toFixed(2)}`;
    document.getElementById("total-bs").innerText = `${(total * currentRate).toFixed(2)} Bs.`;
  }

  // ==========================================
  // PROCESAR Y ENVIAR PEDIDO
  // ==========================================
  async function processOrder() {
    if (!checkStoreStatus()) {
      alert(`Lo sentimos, la tienda está cerrada en este momento.\n\n${SCHEDULE_CONFIG.customClosedMessage}`);
      return;
    }

    const name = document.getElementById("cust-name").value.trim();
    if (!name) return alert("Por favor, ingresa tu nombre completo.");

    const itemKeys = Object.keys(cart);
    if (itemKeys.length === 0) return alert("Por favor, selecciona al menos un producto.");

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.innerText = "Guardando pedido...";

    const orderId = generateOrderId();
    const delivery = document.getElementById("delivery-method").value;
    const payment = document.getElementById("payment-method").value;
    const notes = document.getElementById("cust-notes").value.trim();

    let totalUSD = 0;
    let orderListText = "";
    let itemsDetailArray = [];

    itemKeys.forEach(id => {
      const prod = PRODUCTS.find(p => p.id == id);
      const qty = cart[id];
      const subtotal = prod.price * qty;
      totalUSD += subtotal;
      orderListText += `• ${qty}x ${prod.name} ($${subtotal.toFixed(2)})\n`;
      itemsDetailArray.push(`${qty}x ${prod.name}`);
    });

    const rateFormatted = currentRate.toFixed(2);
    const totalBS = (totalUSD * currentRate).toFixed(2);
    const currentDateStr = new Date().toLocaleString("es-VE");

    const payload = {
      orderId: orderId,
      date: currentDateStr,
      customerName: name,
      deliveryMethod: delivery,
      paymentMethod: payment,
      notes: notes || "N/A",
      itemsDetail: itemsDetailArray.join(", "),
      totalUSD: totalUSD.toFixed(2),
      bcvRate: rateFormatted,
      totalBS: totalBS
    };

    try {
      if (GOOGLE_SHEETS_URL && !GOOGLE_SHEETS_URL.includes("AKfycbwe...")) {
        await fetch(GOOGLE_SHEETS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      }
    } catch (e) {
      console.warn("No se pudo registrar en Google Sheets:", e);
    }

    let msg = `*NUEVO PEDIDO - SPELTA CARACAS*\n`;
    msg += `*ID Pedido:* #${orderId}\n`;
    msg += `--------------------------------\n`;
    msg += `*Cliente:* ${name}\n`;
    msg += `*Entrega:* ${delivery}\n`;
    msg += `*Pago:* ${payment}\n`;
    if (notes) msg += `*Notas/Punto:* ${notes}\n`;
    msg += `--------------------------------\n`;
    msg += `*DETALLE DEL PEDIDO:*\n${orderListText}`;
    msg += `--------------------------------\n`;
    msg += `*TOTAL USD:* $${totalUSD.toFixed(2)}\n`;
    msg += `*TOTAL BS (Tasa ${rateFormatted} Bs/$):* ${totalBS} Bs.\n\n`;
    msg += `Quedo a la espera de confirmación y datos para realizar el pago.`;

    btn.disabled = false;
    btn.innerHTML = `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg> Enviar Pedido por WhatsApp`;

    window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // ==========================================
  // PANEL DE ADMINISTRACIÓN
  // ==========================================
  function openAdminModal() {
    const pass = prompt("Ingresa la clave de administración:");
    if (pass !== "BM-763") return alert("Clave incorrecta");

    renderAdminProducts();
    document.getElementById("admin-modal").classList.remove("hidden");
  }

  function closeAdminModal() {
    document.getElementById("admin-modal").classList.add("hidden");
  }

  function renderAdminProducts() {
    const list = document.getElementById("admin-products-list");
    list.innerHTML = PRODUCTS.map(p => `
      <div class="flex items-center justify-between py-2 text-xs gap-2">
        <div class="flex-1">
          <span class="font-bold block">${p.name}</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-gray-500 font-bold">$</span>
          <input type="number" step="0.50" min="0" value="${p.price.toFixed(2)}" 
                 onchange="updateProductPrice(${p.id}, this.value)" 
                 class="w-16 border border-gray-300 rounded p-1 text-xs text-right font-semibold outline-none focus:border-[#6b584a]">
        </div>
        <button onclick="toggleProductAvailability(${p.id})" class="px-2.5 py-1 rounded font-bold ${p.available ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
          ${p.available ? 'Disponible' : 'Agotado'}
        </button>
      </div>
    `).join('');
  }

  function updateProductPrice(id, newPrice) {
    const val = parseFloat(newPrice);
    if (isNaN(val) || val < 0) return alert("Por favor ingresa un precio válido.");
    
    const prod = PRODUCTS.find(p => p.id === id);
    if (prod) {
      prod.price = val;
      localStorage.setItem("spelta_products", JSON.stringify(PRODUCTS));
      renderCatalog();
      updateSummary();
    }
  }

  function toggleProductAvailability(id) {
    const prod = PRODUCTS.find(p => p.id === id);
    if (prod) {
      prod.available = !prod.available;
      localStorage.setItem("spelta_products", JSON.stringify(PRODUCTS));
      renderAdminProducts();
      renderCatalog();
    }
  }

  function saveManualRate() {
    const val = document.getElementById("manual-rate-input").value;
    if (!val) {
      localStorage.removeItem("spelta_manual_rate");
    } else {
      localStorage.setItem("spelta_manual_rate", val);
    }
    fetchBCVRate();
    closeAdminModal();
  }

  function resetAdminSettings() {
    if (confirm("¿Estás seguro de restablecer los precios y estados por defecto?")) {
      localStorage.removeItem("spelta_products");
      localStorage.removeItem("spelta_manual_rate");
      location.reload();
    }
  }

  // Inicialización
  loadAdminSettings();
  checkStoreStatus();
  fetchBCVRate();
</script>
</body>
</html>
